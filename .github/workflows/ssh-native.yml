name: SSH native checks
on:
  push:
    paths: ['modules/herdr-ssh/**', '.github/workflows/ssh-native.yml']
  pull_request:
    paths: ['modules/herdr-ssh/**', '.github/workflows/ssh-native.yml']
permissions:
  contents: read
concurrency:
  group: ssh-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install paramiko==3.5.1
      - name: Build production SSH code and test check-mode lifecycle
        run: |
          python3 modules/herdr-ssh/tests/tailscale_fixture.py 22265 > /tmp/ssh-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          TAILSCALE_TEST_PORT=22265 swift run --package-path modules/herdr-ssh NativeChecks
